<html>
<head>
<meta charset="utf-8">
<title>Book Card</title>
<style type="text/css">
body {
	font-family: Verdana, Tahoma, 'Segoe UI', Arial, sans-serif;
	background-color: #000000;
	color: #ffffff;
	font-size: 14pt;
	line-height: 175%;
	margin: 0;
	padding: 0.8em;
}
a         { color: #66ccff; text-decoration: underline; }
a:hover   { color: #ffffff; text-decoration: underline; }
b, strong { color: #ffffff; font-weight: bold; }

.titlebox {
	border-bottom: 0.15em solid #ffff00;
	padding-bottom: 0.5em;
	margin-bottom: 0.8em;
}
h1 { font-size: 24pt; font-weight: bold; color: #ffff00; margin: 0; line-height: 130%; }
.subtitle { font-size: 15pt; color: #ffffff; margin-top: 0.3em; }

.coverbox { text-align: center; margin-bottom: 1em; }
.cover { width: 11em; margin: 0 auto; text-align: center; }
#cover { width: 100%; border: 0.15em solid #ffffff; }

.rate { text-align: center; padding: 0.6em 0; }
.rate a { border: none; text-decoration: none; }

.fact {
	border-bottom: 0.08em solid #666666;
	padding: 0.35em 0;
}
.fact .k { color: #ffff00; font-weight: bold; }

.section { border-top: 0.15em solid #ffff00; margin-top: 1.2em; padding-top: 0.5em; }
h2 { font-size: 17pt; font-weight: bold; color: #ffff00; margin: 0 0 0.4em 0; }
.screenshot { height: auto; }
</style>
</head>
<body>

<div class="titlebox">
	<h1>
	<!--#booknum -->.
	<!--#title -->
	</h1>
	<div class="subtitle"><!--#originaltitle --></div>
</div>

<div class="coverbox">
	<div class="cover"><img SRC="_cover_" ID="cover" width="100%" alt=""></div>
	<div class="rate"><!--#rating --></div>
	<div class="rate"><!--#myrating --></div>
	<div class="rate"><!--#playbutton --></div>
</div>

<div class="fact"><span class="k"><!--#authors_lbl -->:</span> <!--#authors --></div>
<div class="fact"><span class="k"><!--#editors_lbl -->:</span> <!--#editors --></div>
<div class="fact"><span class="k"><!--#translators_lbl -->:</span> <!--#translators --></div>
<div class="fact"><span class="k"><!--#illustrators_lbl -->:</span> <!--#illustrators --></div>
<div class="fact"><span class="k"><!--#publisher_lbl -->:</span> <!--#publisheryear --></div>
<div class="fact"><span class="k"><!--#serie_lbl -->:</span> <!--#serie --></div>
<div class="fact"><span class="k"><!--#volume_lbl -->:</span> <!--#volume --></div>
<div class="fact"><span class="k"><!--#subject_lbl -->:</span> <!--#subject --></div>
<div class="fact"><span class="k"><!--#bindingtype_lbl -->:</span> <!--#bindingtype --></div>
<div class="fact"><span class="k"><!--#pages_lbl -->:</span> <!--#pages --></div>
<div class="fact"><span class="k"><!--#language_lbl -->:</span> <!--#language --></div>
<div class="fact"><span class="k">ISBN:</span> <!--#ISBN --></div>
<div class="fact"><span class="k"><!--#price_lbl -->:</span> <!--#price --></div>
<div class="fact"><span class="k"><!--#location_lbl -->:</span> <!--#location --></div>
<div class="fact"><span class="k"><!--#loan_lbl -->:</span> <!--#loan --></div>
<div class="fact"><span class="k"><!--#wishlist_lbl -->:</span> <!--#wishlist --></div>
<div class="fact"><span class="k"><!--#unread_lbl -->:</span> <!--#unread --></div>
<div class="fact"><span class="k"><!--#dateread_lbl -->:</span> <!--#dateread --></div>
<div class="fact"><span class="k"><!--#date_lbl -->:</span> <!--#date --></div>
<div class="fact"><span class="k"><!--#personalmarks_lbl -->:</span> <!--#personalmarks --></div>
<div class="fact"><span class="k"><!--#dimensions_lbl -->:</span> <!--#dimensions --></div>
<div class="fact"><span class="k"><!--#circulation_lbl -->:</span> <!--#circulation --></div>
<div class="fact"><span class="k"><!--#playtime_lbl -->:</span> <!--#playtime --></div>
<div class="fact"><span class="k"><!--#filesize_lbl -->:</span> <!--#filesize --></div>
<div class="fact"><span class="k"><!--#loc_lbl -->:</span> <!--#loc --></div>
<div class="fact"><span class="k"><!--#dewey_lbl -->:</span> <!--#dewey --></div>
<div class="fact"><!--#url --></div>

<div class="section"><h2><!--#synopsis_lbl --></h2><!--#synopsis --></div>
<div class="section"><h2><!--#contents_lbl --></h2><!--#contents --></div>
<div class="section"><h2><!--#comments_lbl --></h2><!--#comments --></div>
<div class="section"><!--#userfield --></div>
<div class="section"><!--#screenshots width="280" --></div>

</body>
</html>

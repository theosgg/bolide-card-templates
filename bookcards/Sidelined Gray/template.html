<html><head>
<style type="text/css">
body {
font-family: Arial, 'Segoe UI', sans-serif;
font-size:90%;
background:#686868;
margin:0;
padding:0;
color:#ffffff;
}

.screenshot {
width:12%;
}


a:link { color: #ffffff;}
a:hover { color: #8B8B8B; text-decoration: underline; }

#left_column {
float:right;
width: 25%;
background:#BEBEBE;
padding:0.4em;
margin-left:0.4em;
text-align:left;
border-left:0.08em solid #973A9F;
}
#left_column div {
margin-bottom:0.25em;
}
#left_column .screenshot {
width:75%;
padding:0;
margin: 1em;
}

.cover {
width:85%;
padding:0;
margin: auto;
}
#cover {
width:100%;
}

.center {
text-align: center;
margin:auto;
}

.header {
text-align:center;
padding:1.5em;
margin:0;
background:#E5E5E5;
}
h1 {
text-transform:capitalize;
font-size:230%;

margin:0;
color:#000000;
}
h2 {
text-transform:capitalize;
margin:0.8em;
padding:0;
text-align:center;
font-size:150%;
color:#595959;
}

.main {
padding:0.3em;
margin:0;
}
.stars {
text-align:center;
padding-top:0.4em;
}
.stars a, #left_column a { border:none; }
.label {
color:#595959;
text-transform: uppercase;
font-weight:bold;
font-size:75%;
}
.labelmain {
color:#E4E4E4;
text-transform: uppercase;
font-weight:bold;
font-size:75%;
}
.syno {
text-align:justify;
padding:0.4em;
margin:0;
}

.clear {
display:block;
clear:both;
}
</style>

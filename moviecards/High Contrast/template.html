<html>
<head>
<meta charset="utf-8">
<title>Movie Card</title>
<style type="text/css">
body {
	font-family: Verdana, Tahoma, 'Segoe UI', Arial, sans-serif;
	background-color: #000000;
	color: #ffffff;
	font-size: 14pt;
	line-height: 175%;
	margin: 0;
	padding: 0.8em;
}
a         { color: #66ccff; text-decoration: underline; }
a:hover   { color: #ffffff; text-decoration: underline; }
b, strong { color: #ffffff; font-weight: bold; }

/* ---- заголовок ---- */
.titlebox {
	border-bottom: 0.15em solid #ffff00;
	padding-bottom: 0.5em;
	margin-bottom: 0.8em;
}
h1 { font-size: 24pt; font-weight: bold; color: #ffff00; margin: 0; line-height: 130%; }
.subtitle { font-size: 15pt; color: #ffffff; margin-top: 0.3em; }

.coverbox { text-align: center; margin-bottom: 1em; }
.cover { width: 11em; margin: 0 auto; text-align: center; }
#cover { width: 100%; border: 0.15em solid #ffffff; }

.rate { text-align: center; padding: 0.6em 0; }
.rate a { border: none; text-decoration: none; }

.fact {
	border-bottom: 0.08em solid #666666;
	padding: 0.35em 0;
}
.fact .k { color: #ffff00; font-weight: bold; }

/* ---- текстовые блоки ---- */
.section { border-top: 0.15em solid #ffff00; margin-top: 1.2em; padding-top: 0.5em; }
h2 { font-size: 17pt; font-weight: bold; color: #ffff00; margin: 0 0 0.4em 0; }
.screenshot { height: auto; }
</style>
</head>
<body>

<div class="titlebox">
	<h1>
	<!--#movienum -->.
	<!--#title -->
	</h1>
	<div class="subtitle"><!--#originaltitle --></div>
</div>

<div class="coverbox">
	<div class="cover"><img SRC="_cover_" ID="cover" width="100%" alt=""></div>
	<div class="rate"><!--#rating --></div>
	<div class="rate"><!--#myrating --></div>
	<div class="rate"><!--#playbutton --></div>
</div>

<div class="fact"><span class="k"><!--#year_lbl -->:</span> <!--#year --></div>
<div class="fact"><span class="k"><!--#genre_lbl -->:</span> <!--#genre --></div>
<div class="fact"><span class="k"><!--#director_lbl -->:</span> <!--#director --></div>
<div class="fact"><span class="k"><!--#scenario_lbl -->:</span> <!--#scenario --></div>
<div class="fact"><span class="k"><!--#actors_lbl -->:</span> <!--#actors --></div>
<div class="fact"><span class="k"><!--#country_lbl -->:</span> <!--#country --></div>
<div class="fact"><span class="k"><!--#studio_lbl -->:</span> <!--#studio --></div>
<div class="fact"><span class="k">MPAA:</span> <!--#mpaa --></div>
<div class="fact"><span class="k"><!--#mediatype_lbl -->:</span> <!--#mediatype -->
(<!--#mediacount -->)
</div>
<div class="fact"><span class="k"><!--#medialabel_lbl -->:</span> <!--#medialabel --></div>
<div class="fact"><span class="k"><!--#medialocation_lbl -->:</span> <!--#medialocation --></div>
<div class="fact"><span class="k"><!--#duration_lbl -->:</span> <!--#duration --></div>
<div class="fact"><span class="k"><!--#filesize_lbl -->:</span> <!--#filesize --></div>
<div class="fact"><span class="k"><!--#resolution_lbl -->:</span> <!--#resolution --></div>
<div class="fact"><span class="k"><!--#quality_lbl -->:</span> <!--#quality --></div>
<div class="fact"><span class="k"><!--#aspectratio_lbl -->:</span> <!--#aspectratio --></div>
<div class="fact"><span class="k"><!--#subtitles_lbl -->:</span> <!--#subtitles --></div>
<div class="fact"><span class="k"><!--#vidinfo_lbl -->:</span> <!--#vidinfo --></div>
<div class="fact"><span class="k"><!--#audinfo_lbl -->:</span> <!--#audinfo --></div>
<div class="fact"><span class="k"><!--#barcode_lbl -->:</span> <!--#barcode --></div>
<div class="fact"><span class="k"><!--#price_lbl -->:</span> <!--#price --></div>
<div class="fact"><span class="k"><!--#loan_lbl -->:</span> <!--#loan --></div>
<div class="fact"><span class="k"><!--#wishlist_lbl -->:</span> <!--#wishlist --></div>
<div class="fact"><span class="k"><!--#seen_lbl -->:</span> <!--#seen --></div>
<div class="fact"><span class="k"><!--#personalmarks_lbl -->:</span> <!--#personalmarks --></div>
<div class="fact"><span class="k"><!--#date_lbl -->:</span> <!--#date --></div>
<div class="fact"><span class="k"><!--#trailer_lbl -->:</span> <!--#trailer --></div>
<div class="fact"><!--#url --></div>
<div class="fact"><!--#similar --></div>

<div class="section"><h2><!--#description_lbl --></h2><!--#description --></div>
<div class="section"><h2><!--#comments_lbl --></h2><!--#comments --></div>
<div class="section"><h2><!--#episodes_lbl --></h2><!--#episodes --></div>
<div class="section"><!--#userfield --></div>
<div class="section"><!--#screenshots width="280" --></div>

</body>
</html>

<html>
<head>
	<style>
	body {
		font-family: 'Segoe UI', Tahoma, Helvetica, Arial;
		background-color: #f2f2f2;
		margin: 0;
		color: #000000;
		font-size: 11pt;
	}
	a { color: #000000; text-decoration: none; }
	a:hover { color: #197f90; }

	table.card { width: 100%; border-collapse: collapse; }
	td.leftcol {
		width: 17em;
		vertical-align: top;
		background-color: #7898c8;
		border-left: 0.55em solid #4f70a0;
		border-right: 0.55em solid #5475a4;
		padding: 1.2em 1.1em 1.4em 1.0em;
	}
	td.maincol {
		vertical-align: top;
		border-left: 0.18em solid #cdcdcd;
		padding: 0.6em 1.4em 1em 1.45em;
	}

	.cover { width: 13.5em; margin: 0.2em auto 0.9em auto; text-align: center; }
	#cover { width: 100%; border: 0.12em solid #e6e6e6; }

	.stars  { text-align: center; margin-bottom: 0.3em; }
	.hearts { text-align: center; margin-bottom: 0.5em; }
	.hearts a, .stars a, .short_info a { border: none; }
	.hearts a:hover, .stars a:hover, .short_info a:hover { color: #333333; text-decoration: none; }

	.short_info { font-size: 10.5pt; line-height: 165%; text-align: left; }
	.short_info b { font-weight: bold; }
	.short_info .playrow { margin: 0.4em 0; text-align: center; }

	.title { text-transform: uppercase; font-size: 18pt; font-weight: bold; color: #5a82be; margin: 0.3em 0 0.2em 0; }
	.original_title { font-size: 11pt; margin: 0 0 0.7em 0; }

	table.gioupi { margin-top: 0.6em; border-collapse: collapse; }
	td.fld {
		text-transform: uppercase;
		font-size: 10pt;
		font-weight: bold;
		color: #5a82be;
		text-align: right;
		vertical-align: top;
		width: 11em;
		padding: 0.2em 0.6em 0.2em 0;
	}
	td.val { font-size: 11pt; vertical-align: top; padding: 0.2em 0; }
	td.actors { min-width: 20em; max-width: 34em; }

	.episodes { margin-top: 1em; }
	.screenshot { height: 13.5em; }
	</style>
</head>
<body>
<table class="card">
<tr>
<td class="leftcol">
	<div class="cover"> <img SRC="_cover_" ID="cover" width="100%"> </div>
	<div class="stars"><!--#rating --></div>
	<div class="short_info">
		<div class="hearts"><!--#myrating --></div>
		<div> <!--#similar --> </div>
		<!--#mediatype_lbl -->: <b><!--#mediatype --> </b>
		<br> <!--#duration_lbl -->: <b><!--#duration --> </b>
		<br> <!--#medialabel_lbl -->: <b><!--#medialabel --> </b>
		<br> <!--#medialocation_lbl -->: <b><!--#medialocation --> </b>
		<br> <!--#filesize_lbl -->: <b><!--#filesize --> </b>
		<br> <!--#subtitles_lbl -->: <b><!--#subtitles --> </b>
		<br> <!--#quality_lbl -->: <b><!--#quality --> </b>
		<br> <!--#resolution_lbl -->: <b><!--#resolution --> </b>
		<br> <!--#aspectratio_lbl -->: <b><!--#aspectratio --> </b>
		<div class="playrow"> <!--#playbutton --></div>
		<br><font color="red"><!--#loan_lbl -->: <b><!--#loan --></b></font>
		<br><!--#wishlist_lbl -->: <label class="checkbox"><!--#wishlist --></label>
		<br><!--#seen_lbl -->: <!--#seen -->
		<br><!--#personalmarks_lbl -->: <!--#personalmarks -->
		<br>
		<br> <!--#date_lbl -->: <b><!--#date --> </b>
		<br><!--#url -->
	</div>
</td>
<td class="maincol">
<div class="title">
<!--#movienum -->.&nbsp;
<!--#title -->
</div>
<div class="original_title">(<!--#originaltitle_lbl -->: <!--#originaltitle -->)</div>
<table class="gioupi">
<tr>	<td class="fld"> <!--#year_lbl -->:</td>			<td class="val"> <!--#year --> </td> </tr>
<tr>	<td class="fld"> <!--#genre_lbl -->:</td>			<td class="val"> <!--#genre --> </td> </tr>
<tr>	<td class="fld"> <!--#director_lbl -->:</td>		<td class="val"> <!--#director --> </td> </tr>
<tr>	<td class="fld"> <!--#scenario_lbl -->:</td>		<td class="val"> <!--#scenario --> </td> </tr>
<tr>	<td class="fld"> <!--#actors_lbl -->:</td>			<td class="val actors"> <!--#actors --></td> </tr>
<tr> 	<td class="fld"> <!--#country_lbl -->:</td>		<td class="val"> <!--#country --> </td>	</tr>
<tr>	<td class="fld"> <!--#studio_lbl -->:</td>			<td class="val"> <!--#studio --> </td> </tr>
<tr>	<td class="fld"> <!--#barcode_lbl -->:</td>		<td class="val"> <!--#barcode --> </td> </tr>
<tr>	<td class="fld">  MPAA:</td>						<td class="val"> <!--#mpaa --> </td> </tr>
<tr>	<td class="fld"> <!--#description_lbl -->:</td>	<td class="val"> <!--#description --> </td> </tr>
<tr>	<td class="fld"> <!--#comments_lbl -->:</td>		<td class="val"> <!--#comments --> </td> </tr>
</table>
<div><!--#trailer_lbl -->: <!--#trailer --></div>
<div><!--#userfield --></div>
<div class="episodes"><!--#episodes --></div>
<!--#screenshots -->
</td>
</tr>
</table>
</body>
</html>
